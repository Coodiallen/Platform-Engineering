[management]
management-node ansible_host=192.168.50.10 ansible_ssh_private_key_file=../vagrant/.vagrant/machines/management-node/libvirt/private_key

[control_plane]
control-plane ansible_host=192.168.50.11 ansible_ssh_private_key_file=../vagrant/.vagrant/machines/control-plane/libvirt/private_key

[workers]
worker-1 ansible_host=192.168.50.12 ansible_ssh_private_key_file=../vagrant/.vagrant/machines/worker-1/libvirt/private_key
worker-2 ansible_host=192.168.50.13 ansible_ssh_private_key_file=../vagrant/.vagrant/machines/worker-2/libvirt/private_key

[k8s_cluster:children]
control_plane
workers

[all:vars]
ansible_user=vagrant
ansible_python_interpreter=/usr/bin/python3
