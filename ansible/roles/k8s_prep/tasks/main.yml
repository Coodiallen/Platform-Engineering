---
- name: Disable SWAP
  ansible.builtin.command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Remove SWAP entry from /etc/fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
    replace: '# \1'

- name: Load kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Ensure kernel modules load on boot
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: '0644'

- name: Set sysctl parameters for K8s
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: true
    sysctl_file: /etc/sysctl.d/k8s.conf
  loop:
    - { key: 'net.bridge.bridge-nf-call-iptables', value: '1' }
    - { key: 'net.bridge.bridge-nf-call-ip6tables', value: '1' }
    - { key: 'net.ipv4.ip_forward', value: '1' }

- name: Install prerequisite packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - containerd
    state: present
    update_cache: true

- name: Create containerd config
  ansible.builtin.shell: |
    mkdir -p /etc/containerd
    containerd config default | sed 's/disabled_plugins = \["cri"\]/disabled_plugins = []/' | sed 's/SystemdCgroup = false/SystemdCgroup = true/' | sed 's|config_path = ""|config_path = "/etc/containerd/certs.d"|' > /etc/containerd/config.toml
  notify: Restart containerd

- name: Create Harbor registry directory for containerd
  ansible.builtin.file:
    path: /etc/containerd/certs.d/192.168.50.10:8080
    state: directory
    mode: '0755'

- name: Configure insecure registry for Harbor via hosts.toml
  ansible.builtin.copy:
    dest: /etc/containerd/certs.d/192.168.50.10:8080/hosts.toml
    content: |
      server = "http://192.168.50.10:8080"

      [host."http://192.168.50.10:8080"]
        capabilities = ["pull", "resolve", "push"]
        skip_verify = true
    mode: '0644'
  notify: Restart containerd

- name: Ensure containerd is running
  ansible.builtin.systemd:
    name: containerd
    state: started
    enabled: true

- name: Download Kubernetes GPG key
  ansible.builtin.get_url:
    url: https://pkgs.k8s.io/core:/stable:/v1.30/deb/Release.key
    dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
    mode: '0644'
    force: false

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc] https://pkgs.k8s.io/core:/stable:/v1.30/deb/ /"
    state: present
    filename: kubernetes

- name: Install K8s packages
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
    update_cache: true

- name: Hold K8s packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl